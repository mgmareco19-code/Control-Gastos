<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="theme-color" content="#0f2a24">
  <title>Control de gastos</title>
  <link rel="icon" type="image/png" href="img/logo-96.png">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tema.js"></script>
</head>
<body class="sin-sesion">
  <header class="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="Menú"><i data-lucide="menu"></i></button>
    <a class="brand" href="#/inicio">
      <img class="brand-logo" src="img/logo-96.png" alt="">
      <span id="brandName">Control de gastos</span>
    </a>
    <button class="user" id="btnCuenta" aria-label="Mi cuenta"><span class="avatar" id="avatar"></span><span class="user-name" id="userName"></span></button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Secciones">
      <a href="#/inicio" data-ruta="inicio" class="nav-item"><i data-lucide="house"></i>Inicio</a>
      <div class="nav-title">Finanzas</div>
      <a href="#/movimientos" data-ruta="movimientos" class="nav-item"><i data-lucide="arrow-left-right"></i>Movimientos</a>
      <a href="#/ingresos" data-ruta="ingresos" class="nav-item"><i data-lucide="arrow-up"></i>Ingresos</a>
      <a href="#/gastos" data-ruta="gastos" class="nav-item"><i data-lucide="arrow-down"></i>Gastos</a>
      <div class="nav-title">Gestión</div>
      <a href="#/categorias" data-ruta="categorias" class="nav-item"><i data-lucide="tag"></i>Categorías</a>
      <a href="#/prestamos" data-ruta="prestamos" class="nav-item"><i data-lucide="banknote"></i>Préstamos</a>
      <a href="#/ahorros" data-ruta="ahorros" class="nav-item"><i data-lucide="piggy-bank"></i>Ahorros</a>
      <div class="nav-title">Cuenta</div>
      <button type="button" class="nav-item" id="navConfig"><i data-lucide="settings"></i>Configuración</button>
      <div class="nav-foot" id="navFoot"></div>
    </nav>
    <div class="scrim" id="scrim"></div>
    <main class="main"><div id="aviso"></div><div id="app" tabindex="-1"></div></main>
  </div>

  <button class="fab" id="fab" aria-label="Nuevo"><i data-lucide="plus"></i></button>

  <div class="auth" id="auth"></div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db-oracle.js"></script>
  <script src="js/db.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
